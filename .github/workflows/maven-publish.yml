name: Java CI with Maven

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  mybuild:
    runs-on: ubuntu-latest

    steps:
      - name: download the code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: check the java version
        run: java --version

      - name: install maven on ubuntu machine
        run: sudo apt update && sudo apt install -y maven

      - name: check the maven installation details
        run: mvn --version
